name: release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # Manual trigger from the Actions tab

# NOTE: no top-level concurrency group here. validate.yml already
# declares its own (`${{ github.workflow }}-${{ github.ref }}`), and
# because `github.workflow` inside a reusable workflow resolves to the
# CALLER's name, both would hash to `release-v0.14.0` and GitHub would
# detect a reusable-workflow deadlock (top level vs callee waiting on
# the same group). Letting validate own the group is enough.

jobs:
  # Reuse the validate pipeline to build all platforms. It produces
  # upload-artifact entries for Linux (x64, arm64), Windows, macOS —
  # in both Debug and Release types. We only ship Release binaries.
  build:
    uses: ./.github/workflows/validate.yml
    secrets: inherit

  release:
    needs: build
    # Run even if some build platforms failed — we ship whatever
    # artifacts were produced. As of v0.14.0 the Linux arm64 and
    # Flatpak builds fail because the prebuilt libjuice.a in
    # lib/coopnet/lib/linux is x86_64-only; macOS, Windows and
    # Linux x64 binaries still get published.
    if: always() && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so generate_release_notes can diff

      - name: Download Release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: BanjoRecompiled-*-Release
          path: artifacts/

      - name: List downloaded artifacts
        run: |
          echo "=== artifact tree ==="
          find artifacts -maxdepth 3 -print
          echo "=== done ==="

      - name: Repackage per-platform release archives
        working-directory: artifacts
        run: |
          set -euo pipefail
          shopt -s nullglob

          mkdir -p ../release
          for dir in */; do
            name="${dir%/}"
            cd "$dir"

            # Figure out the friendly name we want in the release.
            # The artifact names look like:
            #   BanjoRecompiled-Linux-X64-Release
            #   BanjoRecompiled-Linux-ARM64-Release
            #   BanjoRecompiled-Windows-Release
            #   BanjoRecompiled-macOS-Release
            friendly="$(echo "$name" | sed 's/^BanjoRecompiled-/BK64-Online-/; s/-Release$//')"

            # macOS and Linux artifacts each contain a single archive
            # already (BanjoRecompiled.zip / BanjoRecompiled.tar.gz);
            # just rename it. Windows artifact is a loose directory
            # tree (exe + DLLs + assets) — zip it up.
            if [ -f BanjoRecompiled.zip ]; then
              cp BanjoRecompiled.zip "../../release/${friendly}.zip"
            elif [ -f BanjoRecompiled.tar.gz ]; then
              cp BanjoRecompiled.tar.gz "../../release/${friendly}.tar.gz"
            else
              (zip -r "../../release/${friendly}.zip" .)
            fi

            cd ..
          done

          echo "=== release tree ==="
          ls -la ../release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 🎮 BK64-Online — online co-op for Banjo-Kazooie

            Download the binary for your OS below.

            ### Requirements
            - Banjo-Kazooie **NTSC-U 1.0** ROM (not included)
            - A friend 🎉

            ### How to play
            One player hosts (**CoopNet** recommended) and the other joins with the lobby password. Full instructions in the [README](../blob/main/README.md).

            ### What's in this release
            See the auto-generated notes below — they contain the commit summary since the previous tag.
